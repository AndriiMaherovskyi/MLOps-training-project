seed: 42

mlflow:
  tracking_uri: "./mlruns"
  experiment_name: "XGBoost_HPO"
  model_name: "XGBoost_Forecast"

model:
  n_estimators:
    min: 50
    max: 200
  max_depth:
    min: 6
    max: 15
  learning_rate:
    min: 0.01
    max: 0.3
  subsample:
    min: 0.5
    max: 1.0

hpo:
  # sampler: "TPESampler"
  sampler: "RandomSampler"
  direction: "minimize"
  n_trials: 20