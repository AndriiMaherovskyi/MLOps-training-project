name: Main CI

on:
  push:

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flake8 pytest

      - name: Install Airflow for DAG integrity tests
        run: |
          pip install "apache-airflow==2.9.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"

      - name: Lint
        run: |
          flake8 src/train.py src/register_model.py dags tests/test_dag_integrity.py tests/test_data.py tests/test_model.py --max-line-length=88

      - name: DAG integrity test
        run: |
          python -m pytest -q tests/test_dag_integrity.py

      - name: Docker build
        run: |
          docker build -t mlops-lab:ci .
