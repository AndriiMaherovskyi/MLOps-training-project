name: Model CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install "pytest>=7.4" "black>=23.0" flake8 autoflake dvc

      - name: Format code
        run: |
          black .
          autoflake --in-place --remove-unused-variables --remove-all-unused-imports -r src tests

      - name: Lint
        run: |
          flake8 .

      - name: DVC reproduce pipeline
        run: |
          dvc repro

      - name: Train model
        run: |
          python src/train.py

      - name: Run tests
        env:
          R2_THRESHOLD: "0.5"
        run: |
          pytest -q

      - name: Create metrics report
        if: github.event_name == 'pull_request'
        run: |
          echo "## Model Metrics" > report.md
          cat metrics.json >> report.md