name: Model CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install "pytest>=7.4" "black>=23.0" flake8 isort autoflake dvc

      - name: Autoformat code
        run: |
          black . --line-length 79
          isort .
          autoflake --in-place --remove-all-unused-imports --remove-unused-variables -r src tests

      - name: Lint
        run: |
          flake8 . --max-line-length=79

      - name: DVC reproduce pipeline
        run: |
          dvc repro

      - name: Train model
        run: |
          python src/train.py

      - name: Run tests
        env:
          R2_THRESHOLD: "0.5"
        run: |
          pytest -q

      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Metrics" > report.md
          cat metrics.json >> report.md

          echo "## Visualization" >> report.md
          echo "Confusion matrix visualization goes here" >> report.md

          echo "## Quality Gate" >> report.md
          echo "R2 threshold: $R2_THRESHOLD" >> report.md