x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  platform: linux/amd64
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: "mlops-lab-secret"
    AIRFLOW_UID: "50000"
    PYTHONPATH: /opt/airflow/project:/opt/airflow/project/src
    MLFLOW_TRACKING_URI: sqlite:////opt/airflow/project/airflow_state/mlflow.db
    MLFLOW_ARTIFACT_ROOT: /opt/airflow/project/airflow_state/mlruns
  volumes:
    - ./:/opt/airflow/project
    - ./dags:/opt/airflow/dags
  working_dir: /opt/airflow/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  mlflow:
    <<: *airflow-common
    command: >
      bash -c "mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////opt/airflow/project/airflow_state/mlflow.db"
    ports:
      - "5000:5000"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
